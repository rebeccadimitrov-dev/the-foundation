<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>The Foundation — Rebecca Dimitrov</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --red: #6b1010;
  --dark: #0f0f0f;
  --surface: #1c1c1c;
  --white: #ffffff;
  --muted: rgba(255,255,255,0.55);
  --faint: rgba(255,255,255,0.25);
  --border: rgba(255,255,255,0.1);
  --border-hi: rgba(255,255,255,0.7);
  --bar-h: 44px;
  --nav-h: 64px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: var(--dark);
  color: var(--white);
  font-family: 'Jost', sans-serif;
  font-weight: 300;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}

/* ── TOP BAR ── */
#bar {
  position: fixed;
  top: var(--safe-top); left: 0; right: 0;
  height: var(--bar-h);
  background: var(--dark);
  border-bottom: 1px solid var(--border);
  display: flex; flex-direction: column;
  justify-content: center;
  padding: 0 20px;
  z-index: 100;
}
.bar-row {
  display: flex; justify-content: space-between;
  font-size: 10px; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--faint);
  margin-bottom: 6px;
}
.bar-row b { color: var(--white); font-weight: 600; }
.track { height: 1px; background: var(--border); }
.fill { height: 100%; background: var(--white); width: 0; transition: width 0.35s ease; }

/* ── MAIN CONTENT AREA ── */
#content {
  position: fixed;
  top: calc(var(--safe-top) + var(--bar-h));
  bottom: calc(var(--safe-bot) + var(--nav-h));
  left: 0; right: 0;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
}

/* ── BOTTOM NAV ── */
#nav {
  position: fixed;
  bottom: var(--safe-bot); left: 0; right: 0;
  height: var(--nav-h);
  background: var(--dark);
  border-top: 1px solid var(--border);
  display: flex; align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  z-index: 100;
}
#nav.hidden { display: none; }
.btn-back {
  background: none; border: none;
  color: var(--faint); font-family: 'Jost', sans-serif;
  font-size: 10px; letter-spacing: 0.15em;
  text-transform: uppercase; cursor: pointer;
  padding: 10px 0; transition: color 0.2s;
}
.btn-back:hover { color: var(--muted); }
.btn-next {
  background: transparent;
  border: 1px solid rgba(255,255,255,0.45);
  color: var(--white); font-family: 'Jost', sans-serif;
  font-size: 11px; font-weight: 600;
  letter-spacing: 0.18em; text-transform: uppercase;
  padding: 12px 28px; cursor: pointer;
  transition: background 0.2s, color 0.2s;
}
.btn-next:active { background: var(--white); color: var(--dark); }

/* ── PHASE INTRO ── */
.phase-screen {
  min-height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  padding: 32px 24px;
  background: var(--red);
  position: relative;
}
.phase-screen::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse at 50% 0%, rgba(0,0,0,0.35) 0%, transparent 65%);
  pointer-events: none;
}
.phase-screen > * { position: relative; z-index: 1; }
.phase-tag {
  font-size: 10px; font-weight: 500;
  letter-spacing: 0.28em; text-transform: uppercase;
  color: rgba(255,255,255,0.38); margin-bottom: 14px;
}
.phase-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(40px, 12vw, 64px);
  font-weight: 300; line-height: 0.95;
  color: var(--white); margin-bottom: 16px;
}
.phase-title em { display: block; font-style: italic; }
.phase-desc {
  font-size: 14px; color: rgba(255,255,255,0.6);
  line-height: 1.7; max-width: 320px;
  margin: 0 auto 32px;
}
.btn-begin {
  background: var(--white); color: var(--red);
  font-family: 'Jost', sans-serif; font-size: 12px; font-weight: 700;
  letter-spacing: 0.2em; text-transform: uppercase;
  padding: 16px 44px; border: none; cursor: pointer;
  transition: opacity 0.2s;
}
.btn-begin:active { opacity: 0.85; }

/* ── QUESTION ── */
.q-screen { padding: 20px 20px 16px; }
.q-eyebrow {
  font-size: 10px; font-weight: 500;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--faint); margin-bottom: 8px;
}
.q-text {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(20px, 5.5vw, 28px);
  font-weight: 400; line-height: 1.2;
  color: var(--white); margin-bottom: 6px;
  word-wrap: break-word; overflow-wrap: break-word;
}
.q-help {
  font-size: 12px; color: var(--muted);
  margin-bottom: 14px;
}

/* OPTIONS */
.opts { display: flex; flex-direction: column; gap: 7px; margin-bottom: 12px; }
.opt {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--white);
  font-family: 'Jost', sans-serif;
  font-size: 14px; font-weight: 300;
  cursor: pointer; text-align: left; width: 100%;
  transition: border-color 0.12s, background 0.12s;
  -webkit-tap-highlight-color: transparent;
}
.opt:active, .opt.selected {
  border-color: var(--border-hi);
  background: rgba(255,255,255,0.07);
}
.mark {
  width: 18px; height: 18px; flex-shrink: 0;
  border: 1.5px solid var(--faint); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  transition: border-color 0.12s, background 0.12s;
}
.multi .mark { border-radius: 3px; }
.opt.selected .mark { border-color: var(--white); background: var(--white); }
.opt.selected .mark::after {
  content: ''; width: 6px; height: 6px;
  border-radius: 50%; background: var(--dark);
}
.multi.selected .mark::after {
  width: 8px; height: 4px; border-radius: 0; background: none;
  border-left: 2px solid var(--dark); border-bottom: 2px solid var(--dark);
  transform: rotate(-45deg) translate(1px, -1px);
}

/* TEXTAREA */
.q-ta {
  width: 100%;
  background: var(--surface); border: 1px solid var(--border);
  color: var(--white); font-family: 'Jost', sans-serif;
  font-size: 14px; font-weight: 300;
  padding: 12px 14px; outline: none;
  resize: none; line-height: 1.6;
  transition: border-color 0.2s;
  margin-bottom: 12px;
  height: 90px;
}
.q-ta.sm { height: 52px; }
.q-ta::placeholder { color: var(--faint); }
.q-ta:focus { border-color: rgba(255,255,255,0.35); }

/* ERROR */
.err {
  font-size: 12px; color: rgba(255,150,150,0.9);
  margin-bottom: 8px; display: none;
}
.err.show { display: block; }

/* LOADING */
.load-screen {
  min-height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; padding: 40px 24px;
}
.dots { display: flex; gap: 7px; justify-content: center; margin-bottom: 28px; }
.dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: rgba(255,255,255,0.3);
  animation: pulse 1.2s ease-in-out infinite;
}
.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes pulse {
  0%,80%,100% { opacity:0.3; transform:scale(0.8); }
  40% { opacity:1; transform:scale(1); }
}
.load-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(32px, 9vw, 52px); font-weight: 300;
  line-height: 1.1; color: var(--white); margin-bottom: 12px;
}
.load-title em { font-style: italic; }
.load-sub { font-size: 14px; color: var(--muted); }
</style>
</head>
<body>

<div id="bar">
  <div class="bar-row">
    <span>The Foundation</span>
    <b id="bar-label">Phase 1 of 5</b>
  </div>
  <div class="track"><div class="fill" id="fill"></div></div>
</div>

<div id="content"></div>

<div id="nav">
  <button class="btn-back" id="btn-back">← Back</button>
  <button class="btn-next" id="btn-next">Continue →</button>
</div>

<script>
const URLS = {
  Sovereign: 'https://www.rebeccadimitrov.com/results-sovereign',
  Pioneer:   'https://www.rebeccadimitrov.com/results-pioneer',
  Guardian:  'https://www.rebeccadimitrov.com/results-guardian',
  Catalyst:  'https://www.rebeccadimitrov.com/results-catalyst'
};

const VM = {'Creating or building something':'Pioneer','Being completely honest with someone':'Sovereign','Complete freedom — no obligations, no schedule':'Pioneer','Helping someone have a real breakthrough':'Guardian','Achieving something I worked hard for':'Sovereign','Being alone and fully in my own world':'Catalyst','Leading or being someone\'s anchor':'Guardian','Learning something that genuinely challenges me':'Catalyst'};
const DM = {'Pretending to be fine when I\'m not':'Sovereign','Being around people who don\'t think deeply':'Catalyst','Doing things that go against my values':'Sovereign','Having no control over my time':'Pioneer','Not being taken seriously':'Sovereign','Being needed by everyone, constantly':'Pioneer'};
const CM = {'I go inward and get very quiet — I process alone':'Catalyst','I go straight into solution mode — action is my comfort zone':'Pioneer','I reach for distraction — anything to not sit with it':'Guardian','I talk it through with one person I trust completely':'Guardian','I hold it together for everyone else and fall apart privately':'Sovereign'};
const VOM = {'They lean in — I make them think differently':'Catalyst','They feel called out — I\'m direct in a way that hits':'Sovereign','They feel safe — like they can finally say what they\'ve been thinking':'Guardian','They feel inspired — they leave wanting to act immediately':'Pioneer'};
const OM = {'1:1 coaching or mentorship — personal, deep, high-touch':'Sovereign','A course or program people can do at their own pace':'Pioneer','A community or group container':'Guardian','Content and digital products — guides, templates, resources':'Catalyst','A service or done-for-you offering':'Pioneer','I genuinely don\'t know yet':null};

const STEPS = [
  {t:'i',p:1,title:['Who','You Are'],desc:'Before we get into the business — we need to get into you. Answer every question as honestly as you can. The more truthful you are, the more powerful your result.'},
  {t:'q',id:'name',p:1,label:'Phase One — Who You Are',q:'First, what\'s your name?',type:'text',ph:'Your first name...',sm:true},
  {t:'q',id:'age',p:1,label:'Phase One — Who You Are',q:'Which season of life are you in?',type:'s',opts:['Under 18','18 – 24','25 – 34','35 – 44','45+']},
  {t:'q',id:'gender',p:1,label:'Phase One — Who You Are',q:'How do you move through the world?',type:'s',opts:['As a woman','As a man','I prefer not to say']},
  {t:'q',id:'location',p:1,label:'Phase One — Who You Are',q:'Where in the world are you building from?',type:'s',opts:['North America','Europe','Asia','Middle East','Australia / Oceania','Africa','South America']},

  {t:'i',p:2,title:['Your','Patterns'],desc:'Your default behaviours reveal more about your identity than anything you consciously believe about yourself.'},
  {t:'q',id:'values',p:2,label:'Phase Two — Your Patterns',q:'When you feel most alive — what\'s usually happening?',help:'Choose all that resonate.',type:'m',opts:['Creating or building something','Being completely honest with someone','Complete freedom — no obligations, no schedule','Helping someone have a real breakthrough','Achieving something I worked hard for','Being alone and fully in my own world','Leading or being someone\'s anchor','Learning something that genuinely challenges me']},
  {t:'q',id:'drain',p:2,label:'Phase Two — Your Patterns',q:'Which of these depletes you the fastest?',help:'Choose up to two.',type:'m',max:2,opts:['Pretending to be fine when I\'m not','Being around people who don\'t think deeply','Doing things that go against my values','Having no control over my time','Not being taken seriously','Being needed by everyone, constantly']},
  {t:'q',id:'crisis',p:2,label:'Phase Two — Your Patterns',q:'What do you automatically do when things fall apart?',type:'s',opts:['I go inward and get very quiet — I process alone','I go straight into solution mode — action is my comfort zone','I reach for distraction — anything to not sit with it','I talk it through with one person I trust completely','I hold it together for everyone else and fall apart privately']},
  {t:'q',id:'mask',p:2,label:'Phase Two — Your Patterns',q:'How different is the person you show the world from who you actually are?',type:'s',opts:['Very similar — I\'m mostly authentic in how I show up','There\'s a gap — I hold back certain parts of myself','Very different — most people don\'t know the real me at all','I honestly don\'t know anymore — I\'ve been adapting for so long']},

  {t:'i',p:3,title:['Your','Reality'],desc:'Where you are right now matters. These questions personalise your result to your actual starting point.'},
  {t:'q',id:'situation',p:3,label:'Phase Three — Your Reality',q:'What\'s your current situation?',type:'s',opts:['Working a full-time job or corporate role','Self-employed or freelancing','Running my own business already','Between things — in a transition','Stay-at-home or supporting family','Something else entirely']},
  {t:'q',id:'income',p:3,label:'Phase Three — Your Reality',q:'What\'s your total monthly income right now?',help:'Include everything: job, business, side income.',type:'s',opts:['Under $2,000','$2,000 – $5,000','$5,000 – $10,000','$10,000 – $25,000','$25,000+','I\'d prefer not to say']},
  {t:'q',id:'online',p:3,label:'Phase Three — Your Reality',q:'When it comes to building online — what\'s been your experience so far?',type:'s',opts:['I haven\'t started yet — this is completely new','I\'ve tried a few things but nothing has clicked','I\'ve had some wins but I\'m inconsistent','I have something working but I want to grow it faster']},
  {t:'q',id:'brand',p:3,label:'Phase Three — Your Reality',q:'Where does your personal brand stand right now?',type:'s',opts:['I don\'t have one yet','I\'m just starting to show up online','I\'m posting but not getting traction','I have an audience but I\'m not monetising it','I have an audience and I\'m making money — I want more']},
  {t:'q',id:'nightthought',p:3,label:'Phase Three — Your Reality',q:'What\'s the thing that keeps you up at night right now?',type:'text',ph:'Be honest — this is for your result, not for anyone else...'},
  {t:'q',id:'block',p:3,label:'Phase Three — Your Reality',q:'If you look closely at what\'s in the way — what do you see?',type:'s',opts:['I don\'t have a clear offer yet','My audience is too small','Selling feels pushy or uncomfortable','No real strategy — I\'m doing a bit of everything','I doubt whether I\'m credible or experienced enough','I don\'t have the time or support to do it all myself']},
  {t:'q',id:'tried',p:3,label:'Phase Three — Your Reality',q:'What have you already tried before?',help:'Choose all that apply.',type:'m',opts:['Nothing yet — this would be my first real step','Free content: YouTube, podcasts, Instagram, books','Online courses or digital programs','A group program, mastermind, or membership','1:1 coaching or mentorship']},
  {t:'q',id:'whydidntwork',p:3,label:'Phase Three — Your Reality',q:'Why do you think those attempts didn\'t fully work?',type:'text',ph:'Be honest — this is one of the most useful questions in the whole assessment...'},
  {t:'q',id:'vision',p:3,label:'Phase Three — Your Reality',q:'Where do you want your business and life to be in 6–12 months?',type:'text',ph:'Be specific. What does it actually look like?'},

  {t:'i',p:4,title:['Your','Purpose'],desc:'The thing you\'re here to do lives at the intersection of what lights you up and what you\'ve lived through.'},
  {t:'q',id:'gift',p:4,label:'Phase Four — Your Purpose',q:'What do people ask for your help with — without you advertising it?',type:'text',ph:'Think about the last few times someone came to you for advice...'},
  {t:'q',id:'lived',p:4,label:'Phase Four — Your Purpose',q:'Which of these have you been through and come out the other side of?',help:'Choose all that apply.',type:'m',opts:['Rebuilding my identity after a major ending','Finding financial independence on my own terms','Breaking free from other people\'s expectations','Learning to stop shrinking myself to fit in','Building something from nothing','Rediscovering myself outside a role or relationship','Leaving a stable career to pursue something that felt true']},

  {t:'i',p:5,title:['Your Brand','Direction'],desc:'The final questions. These reveal what you\'re actually here to build.'},
  {t:'q',id:'voice',p:5,label:'Phase Five — Your Brand Direction',q:'When you talk about something you care about — how do people usually respond?',type:'s',opts:['They lean in — I make them think differently','They feel called out — I\'m direct in a way that hits','They feel safe — like they can finally say what they\'ve been thinking','They feel inspired — they leave wanting to act immediately']},
  {t:'q',id:'offertype',p:5,label:'Phase Five — Your Brand Direction',q:'What kind of offer feels most aligned to who you are?',type:'s',opts:['1:1 coaching or mentorship — personal, deep, high-touch','A course or program people can do at their own pace','A community or group container','Content and digital products — guides, templates, resources','A service or done-for-you offering','I genuinely don\'t know yet']},
  {t:'q',id:'invest',p:5,label:'Phase Five — Your Brand Direction',q:'What would you realistically invest to build a business fully aligned with you?',type:'s',opts:['I\'d want to start with free resources','Under $500','$500 – $1,500','$1,500 – $5,000','$5,000+ — if it gets me there, I\'m in']},

  {t:'load'}
];

let step = 0;
const ans = {};

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function updateBar(){
  const s = STEPS[step];
  const qs = STEPS.filter(x=>x.t==='q').length;
  const done = STEPS.slice(0,step).filter(x=>x.t==='q').length;
  document.getElementById('fill').style.width = (done/qs*100)+'%';
  document.getElementById('bar-label').textContent = 'Phase '+(s.p||'—')+' of 5';
}

function render(){
  updateBar();
  const s = STEPS[step];
  const content = document.getElementById('content');
  const nav = document.getElementById('nav');

  if(s.t==='i'){
    nav.classList.add('hidden');
    const div = document.createElement('div');
    div.className = 'phase-screen';
    div.innerHTML = `<p class="phase-tag">Phase ${s.p} of 5</p><h2 class="phase-title">${esc(s.title[0])}<em>${esc(s.title[1])}</em></h2><p class="phase-desc">${esc(s.desc)}</p>`;
    const btn = document.createElement('button');
    btn.className = 'btn-begin';
    btn.textContent = step===0 ? 'Begin →' : 'Continue →';
    btn.addEventListener('click', ()=>{ step++; render(); });
    div.appendChild(btn);
    content.innerHTML = '';
    content.appendChild(div);
  } else if(s.t==='q'){
    nav.classList.remove('hidden');
    const isLast = STEPS[step+1]?.t === 'load';
    document.getElementById('btn-next').textContent = isLast ? 'See My Result →' : 'Continue →';

    let input = '';
    const v = ans[s.id];
    if(s.type==='text'){
      input = `<textarea class="q-ta${s.sm?' sm':''}" id="ta" placeholder="${esc(s.ph||'')}">${esc(v||'')}</textarea>`;
    } else {
      const items = s.opts.map(o => {
        const sel = s.type==='m' ? (Array.isArray(v)&&v.includes(o)) : v===o;
        return `<button class="opt${s.type==='m'?' multi':''}${sel?' selected':''}" data-v="${esc(o)}"><span class="mark"></span><span>${esc(o)}</span></button>`;
      }).join('');
      input = `<div class="opts${s.type==='m'?' multi':''}" id="opts">${items}</div>`;
    }

    const div = document.createElement('div');
    div.className = 'q-screen';
    div.innerHTML = `
      <p class="q-eyebrow">${esc(s.label||'')}</p>
      <p class="q-text">${esc(s.q)}</p>
      ${s.help ? `<p class="q-help">${esc(s.help)}</p>` : ''}
      ${input}
      <p class="err" id="err">Please answer this question to continue.</p>`;
    content.innerHTML = '';
    content.appendChild(div);
    content.scrollTop = 0;

    const opts = div.querySelector('#opts');
    if(opts){
      opts.addEventListener('click', e => {
        const btn = e.target.closest('.opt');
        if(!btn) return;
        const isM = opts.classList.contains('multi');
        if(!isM){
          opts.querySelectorAll('.opt').forEach(o=>o.classList.remove('selected'));
          btn.classList.add('selected');
        } else {
          const max = s.max||999;
          if(btn.classList.contains('selected')){ btn.classList.remove('selected'); }
          else if(opts.querySelectorAll('.opt.selected').length < max){ btn.classList.add('selected'); }
        }
      });
    }
  } else if(s.t==='load'){
    nav.classList.add('hidden');
    const div = document.createElement('div');
    div.className = 'load-screen';
    div.innerHTML = `<div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div><h2 class="load-title">Building your<br><em>Blueprint</em></h2><p class="load-sub">Analysing your answers...</p>`;
    content.innerHTML = '';
    content.appendChild(div);
    setTimeout(redirect, 2500);
  }
}

function validate(){
  const s = STEPS[step];
  if(s.t!=='q') return true;
  const err = document.getElementById('err');
  if(s.type==='text'){
    const v = (document.getElementById('ta')||{}).value||'';
    if(!v.trim()){ if(err) err.classList.add('show'); return false; }
    ans[s.id] = v.trim();
  } else {
    const sel = document.querySelectorAll('.opt.selected');
    if(!sel.length){ if(err) err.classList.add('show'); return false; }
    ans[s.id] = s.type==='m'
      ? Array.from(sel).map(o=>o.querySelector('span:last-child').textContent)
      : sel[0].querySelector('span:last-child').textContent;
  }
  if(err) err.classList.remove('show');
  return true;
}

function score(){
  const pts = {Sovereign:0,Pioneer:0,Guardian:0,Catalyst:0};
  (ans.values||[]).forEach(v=>{ if(VM[v]) pts[VM[v]]+=2; });
  (ans.drain||[]).forEach(v=>{ if(DM[v]) pts[DM[v]]+=1; });
  if(ans.crisis&&CM[ans.crisis]) pts[CM[ans.crisis]]+=2;
  if(ans.voice&&VOM[ans.voice]) pts[VOM[ans.voice]]+=3;
  if(ans.offertype&&OM[ans.offertype]) pts[OM[ans.offertype]]+=2;
  const top = Math.max(...Object.values(pts));
  return Object.keys(pts).find(k=>pts[k]===top)||'Sovereign';
}

function redirect(){ window.location.href = URLS[score()]; }

document.getElementById('btn-next').addEventListener('click', ()=>{
  if(!validate()) return;
  if(step < STEPS.length-1) step++;
  render();
});
document.getElementById('btn-back').addEventListener('click', ()=>{
  if(step > 0) step--;
  render();
});

render();
</script>
</body>
</html>
