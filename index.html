<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Foundation — Rebecca Dimitrov</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --red: #6b1010;
  --red-dark: #4d0b0b;
  --dark: #111010;
  --white: #ffffff;
  --muted: rgba(255,255,255,0.6);
  --faint: rgba(255,255,255,0.28);
  --border: rgba(255,255,255,0.1);
  --border-active: rgba(255,255,255,0.7);
  --surface: #1a1717;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html {
  height: 100%;
  scroll-padding-top: env(safe-area-inset-top, 0px);
}
body {
  height: 100%;
  background: var(--dark);
  color: var(--white);
  font-family: 'Jost', sans-serif;
  font-weight: 300;
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

/* BAR */
.bar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  background: var(--dark);
  padding: 12px 20px 10px;
  z-index: 10;
  border-bottom: 1px solid var(--border);
}
.bar-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--faint);
  margin-bottom: 8px;
}
.bar-row b { color: var(--white); font-weight: 600; }
.track { height: 1px; background: var(--border); overflow: hidden; }
.fill { height: 100%; background: var(--white); width: 0; transition: width 0.4s ease; }

/* PHASE INTRO */
.phase-wrap {
  min-height: calc(100vh - 48px);
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--red);
  text-align: center;
  padding: 40px 24px;
  position: relative;
  overflow: hidden;
}
.phase-wrap::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at 50% 0%, rgba(0,0,0,0.3) 0%, transparent 60%);
  pointer-events: none;
}
.phase-inner {
  position: relative; z-index: 1;
  max-width: 480px; margin: 0 auto;
}
.phase-tag {
  font-size: 10px; font-weight: 500;
  letter-spacing: 0.28em; text-transform: uppercase;
  color: rgba(255,255,255,0.4); margin-bottom: 16px;
}
.phase-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(40px, 11vw, 64px);
  font-weight: 300; line-height: 1.0;
  color: var(--white); margin-bottom: 16px;
}
.phase-title em { font-style: italic; display: block; }
.phase-desc {
  font-size: 15px; color: rgba(255,255,255,0.6);
  line-height: 1.7; max-width: 360px;
  margin: 0 auto 32px;
}

/* QUESTION SCREEN */
.screen {
  display: flex;
  flex-direction: column;
  height: calc(100vh - 48px);
  padding: 24px 20px 20px;
  max-width: 560px;
  margin: 0 auto;
  overflow: hidden;
}

.eyebrow {
  font-size: 10px; font-weight: 500;
  letter-spacing: 0.25em; text-transform: uppercase;
  color: var(--faint); margin-bottom: 10px;
  flex-shrink: 0;
}
.qtext {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(22px, 5.5vw, 32px);
  font-weight: 400; line-height: 1.2;
  margin-bottom: 8px; color: var(--white);
  flex-shrink: 0;
}
.qhelp {
  font-size: 13px; color: var(--muted);
  margin-bottom: 16px; flex-shrink: 0;
}

/* OPTIONS */
.options {
  display: flex; flex-direction: column;
  gap: 8px; margin-bottom: 16px;
  flex: 1; overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.opt {
  display: grid; grid-template-columns: 22px 1fr;
  gap: 12px; align-items: center;
  text-align: left; width: 100%;
  padding: 13px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--white);
  font-family: 'Jost', sans-serif;
  font-size: 14px; font-weight: 300;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
  flex-shrink: 0;
}
.opt:hover { border-color: rgba(255,255,255,0.35); background: rgba(255,255,255,0.04); }
.opt.selected { border-color: var(--border-active); background: rgba(255,255,255,0.07); }
.mark {
  width: 18px; height: 18px;
  border: 1.5px solid var(--faint);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: border-color 0.15s, background 0.15s;
}
.opt.multi .mark { border-radius: 3px; }
.opt.selected .mark { border-color: var(--white); background: var(--white); }
.opt.selected .mark::after {
  content: ''; width: 6px; height: 6px;
  border-radius: 50%; background: var(--dark);
}
.opt.multi.selected .mark::after {
  width: 8px; height: 4px; border-radius: 0; background: none;
  border-left: 2px solid var(--dark); border-bottom: 2px solid var(--dark);
  transform: rotate(-45deg) translate(1px, -1px);
}

/* TEXTAREA */
.q-textarea {
  width: 100%; flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--white);
  font-family: 'Jost', sans-serif;
  font-size: 14px; font-weight: 300;
  padding: 14px 16px; outline: none;
  min-height: 80px; max-height: 180px;
  resize: none; line-height: 1.65;
  transition: border-color 0.2s;
  margin-bottom: 16px;
}
.q-textarea.small {
  min-height: 52px; max-height: 52px;
  flex: none;
}
.q-textarea::placeholder { color: var(--faint); }
.q-textarea:focus { border-color: rgba(255,255,255,0.35); }

/* ERROR */
.err {
  font-size: 12px; color: rgba(255,160,160,0.9);
  margin-bottom: 10px; display: none; flex-shrink: 0;
}
.err.show { display: block; }

/* NAV */
.nav {
  display: flex; justify-content: space-between; align-items: center;
  padding-top: 14px; border-top: 1px solid var(--border);
  flex-shrink: 0;
  margin-top: auto;
  padding-bottom: env(safe-area-inset-bottom, 8px);
}
.btn-back {
  background: none; border: none; color: var(--faint);
  font-family: 'Jost', sans-serif; font-size: 10px;
  letter-spacing: 0.15em; text-transform: uppercase;
  cursor: pointer; padding: 8px 0; transition: color 0.2s;
}
.btn-back:hover { color: var(--muted); }
.btn-next {
  background: transparent;
  border: 1px solid rgba(255,255,255,0.5);
  color: var(--white);
  font-family: 'Jost', sans-serif; font-size: 11px; font-weight: 600;
  letter-spacing: 0.18em; text-transform: uppercase;
  padding: 14px 28px; cursor: pointer;
  transition: background 0.2s, color 0.2s;
}
.btn-next:hover { background: var(--white); color: var(--dark); }

/* CONTINUE BTN on phase intros */
.btn-continue {
  display: inline-block; background: var(--white); color: var(--red);
  font-family: 'Jost', sans-serif; font-size: 12px; font-weight: 700;
  letter-spacing: 0.2em; text-transform: uppercase;
  padding: 18px 48px; border: none; cursor: pointer;
  transition: background 0.2s;
}
.btn-continue:hover { background: rgba(255,255,255,0.88); }

/* LOADING */
.loading-screen {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: calc(100vh - 48px);
  text-align: center; padding: 40px 24px;
}
.loading-dots { display: flex; gap: 8px; justify-content: center; margin-bottom: 32px; }
.dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: rgba(255,255,255,0.3);
  animation: pulse 1.2s ease-in-out infinite;
}
.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes pulse { 0%,80%,100%{opacity:0.3;transform:scale(0.8)} 40%{opacity:1;transform:scale(1)} }
.loading-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(32px, 8vw, 52px); font-weight: 300;
  line-height: 1.1; color: var(--white); margin-bottom: 14px;
}
.loading-title em { font-style: italic; }
.loading-sub { font-size: 14px; color: var(--muted); }
</style>
</head>
<body>

<div id="quiz">
  <div class="bar">
    <div class="bar-row">
      <span>The Foundation</span>
      <b id="bar-label">Phase 1 of 5</b>
    </div>
    <div class="track"><div class="fill" id="fill"></div></div>
  </div>
  <div id="app"></div>
</div>

<script>
const RESULT_URLS = {
  Sovereign: 'https://www.rebeccadimitrov.com/results-sovereign',
  Pioneer:   'https://www.rebeccadimitrov.com/results-pioneer',
  Guardian:  'https://www.rebeccadimitrov.com/results-guardian',
  Catalyst:  'https://www.rebeccadimitrov.com/results-catalyst'
};

const VALUE_MAP = {
  'Creating or building something': 'Pioneer',
  'Being completely honest with someone': 'Sovereign',
  'Complete freedom — no obligations, no schedule': 'Pioneer',
  'Helping someone have a real breakthrough': 'Guardian',
  'Achieving something I worked hard for': 'Sovereign',
  'Being alone and fully in my own world': 'Catalyst',
  'Leading or being someone\'s anchor': 'Guardian',
  'Learning something that genuinely challenges me': 'Catalyst'
};
const DRAIN_MAP = {
  'Pretending to be fine when I\'m not': 'Sovereign',
  'Being around people who don\'t think deeply': 'Catalyst',
  'Doing things that go against my values': 'Sovereign',
  'Having no control over my time': 'Pioneer',
  'Not being taken seriously': 'Sovereign',
  'Being needed by everyone, constantly': 'Pioneer'
};
const CRISIS_MAP = {
  'I go inward and get very quiet — I process alone': 'Catalyst',
  'I go straight into solution mode — action is my comfort zone': 'Pioneer',
  'I reach for distraction — anything to not sit with it': 'Guardian',
  'I talk it through with one person I trust completely': 'Guardian',
  'I hold it together for everyone else and fall apart privately': 'Sovereign'
};
const VOICE_MAP = {
  'They lean in — I make them think differently': 'Catalyst',
  'They feel called out — I\'m direct in a way that hits': 'Sovereign',
  'They feel safe — like they can finally say what they\'ve been thinking': 'Guardian',
  'They feel inspired — they leave wanting to act immediately': 'Pioneer'
};
const OFFER_MAP = {
  '1:1 coaching or mentorship — personal, deep, high-touch': 'Sovereign',
  'A course or program people can do at their own pace': 'Pioneer',
  'A community or group container': 'Guardian',
  'Content and digital products — guides, templates, resources': 'Catalyst',
  'A service or done-for-you offering': 'Pioneer',
  'I genuinely don\'t know yet': null
};

const STEPS = [
  { t:'intro', phase:1, title:['Who','You Are'], desc:'Before we get into the business — we need to get into you. Answer every question as honestly as you can. The more truthful you are, the more powerful your result.' },
  { t:'q', id:'name', phase:1, label:'Phase One — Who You Are', q:'First, what\'s your name?', type:'text', placeholder:'Your first name...', small:true },
  { t:'q', id:'age', phase:1, label:'Phase One — Who You Are', q:'Which season of life are you in right now?', type:'single', opts:['Under 18','18 – 24','25 – 34','35 – 44','45+'] },
  { t:'q', id:'gender', phase:1, label:'Phase One — Who You Are', q:'How do you move through the world?', type:'single', opts:['As a woman','As a man','I prefer not to say'] },
  { t:'q', id:'location', phase:1, label:'Phase One — Who You Are', q:'Where in the world are you building from?', type:'single', opts:['North America','Europe','Asia','Middle East','Australia / Oceania','Africa','South America'] },

  { t:'intro', phase:2, title:['Your','Patterns'], desc:'Your default behaviours reveal more about your identity than anything you consciously believe about yourself.' },
  { t:'q', id:'values', phase:2, label:'Phase Two — Your Patterns', q:'When you feel most alive — what\'s usually happening?', help:'Choose all that resonate.', type:'multi', opts:['Creating or building something','Being completely honest with someone','Complete freedom — no obligations, no schedule','Helping someone have a real breakthrough','Achieving something I worked hard for','Being alone and fully in my own world','Leading or being someone\'s anchor','Learning something that genuinely challenges me'] },
  { t:'q', id:'drain', phase:2, label:'Phase Two — Your Patterns', q:'Which of these depletes you the fastest?', help:'Choose up to two.', type:'multi', max:2, opts:['Pretending to be fine when I\'m not','Being around people who don\'t think deeply','Doing things that go against my values','Having no control over my time','Not being taken seriously','Being needed by everyone, constantly'] },
  { t:'q', id:'crisis', phase:2, label:'Phase Two — Your Patterns', q:'What do you automatically do when things fall apart?', type:'single', opts:['I go inward and get very quiet — I process alone','I go straight into solution mode — action is my comfort zone','I reach for distraction — anything to not sit with it','I talk it through with one person I trust completely','I hold it together for everyone else and fall apart privately'] },
  { t:'q', id:'mask', phase:2, label:'Phase Two — Your Patterns', q:'How different is the person you show the world from who you actually are?', type:'single', opts:['Very similar — I\'m mostly authentic in how I show up','There\'s a gap — I hold back certain parts of myself','Very different — most people don\'t know the real me at all','I honestly don\'t know anymore — I\'ve been adapting for so long'] },

  { t:'intro', phase:3, title:['Your','Reality'], desc:'Where you are right now matters. These questions personalise your result to your actual starting point.' },
  { t:'q', id:'situation', phase:3, label:'Phase Three — Your Reality', q:'What\'s your current situation?', type:'single', opts:['Working a full-time job or corporate role','Self-employed or freelancing','Running my own business already','Between things — in a transition','Stay-at-home or supporting family','Something else entirely'] },
  { t:'q', id:'income', phase:3, label:'Phase Three — Your Reality', q:'What\'s your total monthly income right now?', help:'Include everything: job, business, side income.', type:'single', opts:['Under $2,000','$2,000 – $5,000','$5,000 – $10,000','$10,000 – $25,000','$25,000+','I\'d prefer not to say'] },
  { t:'q', id:'online', phase:3, label:'Phase Three — Your Reality', q:'When it comes to building online — what\'s been your experience so far?', type:'single', opts:['I haven\'t started yet — this is completely new','I\'ve tried a few things but nothing has clicked','I\'ve had some wins but I\'m inconsistent','I have something working but I want to grow it faster'] },
  { t:'q', id:'brand', phase:3, label:'Phase Three — Your Reality', q:'Where does your personal brand stand right now?', type:'single', opts:['I don\'t have one yet','I\'m just starting to show up online','I\'m posting but not getting traction','I have an audience but I\'m not monetising it','I have an audience and I\'m making money — I want more'] },
  { t:'q', id:'nightthought', phase:3, label:'Phase Three — Your Reality', q:'What\'s the thing that keeps you up at night right now?', type:'text', placeholder:'Be honest — this is for your result, not for anyone else...' },
  { t:'q', id:'block', phase:3, label:'Phase Three — Your Reality', q:'If you look closely at what\'s actually in the way — what do you see?', type:'single', opts:['I don\'t have a clear offer yet','My audience is too small','Selling feels pushy or uncomfortable','No real strategy — I\'m doing a bit of everything','I doubt whether I\'m credible or experienced enough','I don\'t have the time or support to do it all myself'] },
  { t:'q', id:'tried', phase:3, label:'Phase Three — Your Reality', q:'What have you already tried before?', help:'Choose all that apply.', type:'multi', opts:['Nothing yet — this would be my first real step','Free content: YouTube, podcasts, Instagram, books','Online courses or digital programs','A group program, mastermind, or membership','1:1 coaching or mentorship'] },
  { t:'q', id:'whydidntwork', phase:3, label:'Phase Three — Your Reality', q:'Why do you think those attempts didn\'t fully work?', type:'text', placeholder:'Be honest — this is one of the most useful questions in the whole assessment...' },
  { t:'q', id:'vision', phase:3, label:'Phase Three — Your Reality', q:'Where do you want your business and life to be in 6–12 months?', type:'text', placeholder:'Be specific. What does it actually look like?' },

  { t:'intro', phase:4, title:['Your','Purpose'], desc:'The thing you\'re here to do lives at the intersection of what lights you up and what you\'ve lived through.' },
  { t:'q', id:'gift', phase:4, label:'Phase Four — Your Purpose', q:'What do people ask for your help with — without you advertising it?', type:'text', placeholder:'Think about the last few times someone came to you for advice...' },
  { t:'q', id:'lived', phase:4, label:'Phase Four — Your Purpose', q:'Which of these have you genuinely been through and come out the other side of?', help:'Choose all that apply.', type:'multi', opts:['Rebuilding my identity after a major ending','Finding financial independence on my own terms','Breaking free from other people\'s expectations','Learning to stop shrinking myself to fit in','Building something from nothing','Rediscovering myself outside a role or relationship','Leaving a stable career to pursue something that felt true'] },

  { t:'intro', phase:5, title:['Your Brand','Direction'], desc:'The final questions. These reveal what you\'re actually here to build.' },
  { t:'q', id:'voice', phase:5, label:'Phase Five — Your Brand Direction', q:'When you talk about something you care about — how do people usually respond?', type:'single', opts:['They lean in — I make them think differently','They feel called out — I\'m direct in a way that hits','They feel safe — like they can finally say what they\'ve been thinking','They feel inspired — they leave wanting to act immediately'] },
  { t:'q', id:'offertype', phase:5, label:'Phase Five — Your Brand Direction', q:'What kind of offer feels most aligned to who you are?', type:'single', opts:['1:1 coaching or mentorship — personal, deep, high-touch','A course or program people can do at their own pace','A community or group container','Content and digital products — guides, templates, resources','A service or done-for-you offering','I genuinely don\'t know yet'] },
  { t:'q', id:'invest', phase:5, label:'Phase Five — Your Brand Direction', q:'What would you realistically be willing to invest to build a business fully aligned with you?', type:'single', opts:['I\'d want to start with free resources','Under $500','$500 – $1,500','$1,500 – $5,000','$5,000+ — if it gets me there, I\'m in'] },

  { t:'loading' }
];

let step = 0;
const answers = {};

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function render(){
  const s = STEPS[step];
  const qSteps = STEPS.filter(x=>x.t==='q');
  const doneQ = STEPS.slice(0,step).filter(x=>x.t==='q').length;
  document.getElementById('fill').style.width=(doneQ/qSteps.length*100)+'%';
  document.getElementById('bar-label').textContent='Phase '+(s.phase||'—')+' of 5';
  const app = document.getElementById('app');
  if(s.t==='intro') renderIntro(s,app);
  else if(s.t==='q') renderQ(s,app);
  else if(s.t==='loading') renderLoading(app);
  window.scrollTo(0,0);
}

function renderIntro(s,app){
  const wrap=document.createElement('div');
  wrap.className='phase-wrap';
  const inner=document.createElement('div');
  inner.className='phase-inner';
  inner.innerHTML=`<p class="phase-tag">Phase ${s.phase} of 5</p><h2 class="phase-title">${esc(s.title[0])}<em>${esc(s.title[1])}</em></h2><p class="phase-desc">${esc(s.desc)}</p>`;
  const btn=document.createElement('button');
  btn.className='btn-continue';
  btn.textContent=step===0?'Begin →':'Continue →';
  btn.addEventListener('click',next);
  inner.appendChild(btn);
  wrap.appendChild(inner);
  app.innerHTML='';
  app.appendChild(wrap);
}

function renderQ(s,app){
  const div=document.createElement('div');
  div.className='screen';
  let inputHTML='';
  const val=answers[s.id];

  if(s.type==='text'){
    inputHTML=`<textarea class="q-textarea${s.small?' small':''}" id="q-input" placeholder="${esc(s.placeholder||'')}">${esc(val||'')}</textarea>`;
  } else {
    const cls='options'+(s.type==='multi'?' multi':'');
    const items=s.opts.map(o=>{
      const sel=s.type==='multi'?(Array.isArray(val)&&val.includes(o)):val===o;
      return `<button class="opt${s.type==='multi'?' multi':''}${sel?' selected':''}" data-val="${esc(o)}"><span class="mark"></span><span>${esc(o)}</span></button>`;
    }).join('');
    inputHTML=`<div class="${cls}" id="opts-wrap">${items}</div>`;
  }

  const isLast = STEPS[step+1] && STEPS[step+1].t==='loading';

  div.innerHTML=`
    <p class="eyebrow">${esc(s.label||'')}</p>
    <p class="qtext">${esc(s.q)}</p>
    ${s.help?`<p class="qhelp">${esc(s.help)}</p>`:''}
    ${inputHTML}
    <p class="err" id="err">Please answer this question to continue.</p>
    <div class="nav">
      <button class="btn-back" id="btn-back">← Back</button>
      <button class="btn-next" id="btn-next">${isLast?'See My Result →':'Continue →'}</button>
    </div>`;

  app.innerHTML='';
  app.appendChild(div);

  const wrap=div.querySelector('#opts-wrap');
  if(wrap){
    wrap.addEventListener('click',function(e){
      const btn=e.target.closest('.opt');
      if(!btn) return;
      const isMulti=wrap.classList.contains('multi');
      if(!isMulti){
        wrap.querySelectorAll('.opt').forEach(o=>o.classList.remove('selected'));
        btn.classList.add('selected');
      } else {
        const max=s.max||999;
        if(btn.classList.contains('selected')){ btn.classList.remove('selected'); }
        else { const cur=wrap.querySelectorAll('.opt.selected').length; if(cur<max) btn.classList.add('selected'); }
      }
    });
  }

  div.querySelector('#btn-next').addEventListener('click',next);
  div.querySelector('#btn-back').addEventListener('click',back);
}

function renderLoading(app){
  const div=document.createElement('div');
  div.innerHTML=`<div class="loading-screen">
    <div class="loading-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    <h2 class="loading-title">Building your<br><em>Blueprint</em></h2>
    <p class="loading-sub">Analysing your answers...</p>
  </div>`;
  app.innerHTML='';
  app.appendChild(div);
  setTimeout(showResult,2500);
}

function validate(){
  const s=STEPS[step];
  if(s.t!=='q') return true;
  const errEl=document.getElementById('err');
  if(s.type==='text'){
    const v=(document.getElementById('q-input')||{}).value||'';
    if(!v.trim()){ if(errEl) errEl.classList.add('show'); return false; }
    answers[s.id]=v.trim();
  } else {
    const sel=document.querySelectorAll('.opt.selected');
    if(!sel.length){ if(errEl) errEl.classList.add('show'); return false; }
    if(s.type==='multi') answers[s.id]=Array.from(sel).map(o=>o.querySelector('span:last-child').textContent);
    else answers[s.id]=sel[0].querySelector('span:last-child').textContent;
  }
  if(errEl) errEl.classList.remove('show');
  return true;
}

function next(){ if(!validate()) return; if(step<STEPS.length-1) step++; render(); }
function back(){ if(step>0) step--; render(); }

function score(){
  const pts={Sovereign:0,Pioneer:0,Guardian:0,Catalyst:0};
  (answers.values||[]).forEach(v=>{ if(VALUE_MAP[v]) pts[VALUE_MAP[v]]+=2; });
  (answers.drain||[]).forEach(v=>{ if(DRAIN_MAP[v]) pts[DRAIN_MAP[v]]+=1; });
  if(answers.crisis&&CRISIS_MAP[answers.crisis]) pts[CRISIS_MAP[answers.crisis]]+=2;
  if(answers.voice&&VOICE_MAP[answers.voice]) pts[VOICE_MAP[answers.voice]]+=3;
  if(answers.offertype&&OFFER_MAP[answers.offertype]) pts[OFFER_MAP[answers.offertype]]+=2;
  const top=Math.max(...Object.values(pts));
  return Object.keys(pts).filter(k=>pts[k]===top)[0]||'Sovereign';
}

function showResult(){
  window.location.href=RESULT_URLS[score()];
}

render();
</script>
